[project]
name = "meg-encoding-course"
version = "0.1.0"
description = "Python environment for the MEG encoding course 2026."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "h5py>=3.16.0",
    "imageio>=2.37.3",
    "joblib>=1.5.3",
    "matplotlib>=3.10.8",
    "megcourselib",
    "mne>=1.12.0",
    "numpy>=2.4.4",
    "scikit-image>=0.26.0",
    "scikit-learn>=1.8.0",
    "seaborn>=0.13.2",
    "torch==2.5.1",
    "torchvision==0.20.1",
]

[tool.uv.workspace]
members = [
    "megcourselib",
]

[tool.uv.sources]
megcourselib = { workspace = true, editable = true }
torch = { index = "pytorch-cu121" }
torchvision = { index = "pytorch-cu121" }

[[tool.uv.index]]
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"
explicit = true

[dependency-groups]
dev = [
    "ipykernel>=7.2.0",
]
