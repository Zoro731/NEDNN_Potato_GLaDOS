[project]
name = "meg-encoding-course"
version = "0.1.0"
description = "Python environment for the MEG encoding course 2026."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "imageio>=2.37.3",
    "joblib>=1.5.3",
    "matplotlib>=3.10.8",
    "megcourselib",
    "mne>=1.12.0",
    "numpy>=2.4.4",
    "scikit-image>=0.26.0",
    "scikit-learn>=1.8.0",
    "seaborn>=0.13.2",
    "torch>=2.11.0",
    "torchvision>=0.26.0",
]

[tool.uv.workspace]
members = [
    "megcourselib",
]

[tool.uv.sources]
megcourselib = { workspace = true, editable = true }

[dependency-groups]
dev = [
    "ipykernel>=7.2.0",
]
